[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "webaudit"
version = "0.1.0"
description = "Website audit core: polite scanning, checks, scoring. Shared by the CLI and the SaaS backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "rich>=13.0",
  "anthropic>=1.0",  # the AI design review (ai_review.py); only called when a Claude key is given
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.45", "trustme>=1.1", "ruff>=0.6"]

[project.scripts]
webaudit = "webaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webaudit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: needs a Chromium executable for Playwright"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
