[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "webaudit-api"
version = "0.6.0"
description = "SaaS backend for the website audit tool: auth, workspaces, batch audits with live progress, business search."
requires-python = ">=3.11"
# `webaudit` is the scanning core in ../core; install it first (pip install -e ../core).
dependencies = [
  "webaudit",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "cryptography>=42",
  "argon2-cffi>=23",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
webaudit-api = "webaudit_api.main:run"
webaudit-worker = "webaudit_api.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/webaudit_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
