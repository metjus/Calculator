[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "webaudit-desktop"
version = "0.5.0"
description = "Web Audit as a Windows desktop program (WebAudit.exe): local server + native window, data next to the exe."
requires-python = ">=3.11"
# Install the core and the API first: pip install -e "../core[browser]" -e ../api
dependencies = [
  "webaudit[browser]",
  "webaudit-api",
  "pywebview>=6.2",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyinstaller>=6.10", "trustme>=1.1"]

[project.gui-scripts]
webaudit-desktop = "webaudit_desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webaudit_desktop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
